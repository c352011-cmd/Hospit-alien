    <title>MASS</title>

  <style>
    .one {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      text-align: center;
      margin-top: -50px;
    }
    .one2 {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      text-align: center;
      margin-top: -70;
      color: white;
      margin-bottom: 50px;
    }
    .check-item {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 1rem;
    }

    .check-item input[type="checkbox"] {
      display: none;
    }

    .checkmark {
      width: 24px;
      height: 24px;
      border: 2px solid var(--black);
      border-radius: 4px;
      background: var(--white);
      flex-shrink: 0;
      transition: 0.2s ease;
      position: relative;
    }

    .check-item input:checked + .checkmark::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 6px;
      width: 6px;
      height: 12px;
      border: 2px solid var(--black);
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .check-item input:checked + .checkmark {
      background: var(--green);
      border-color: var(--black);
    }

    .check-item input:checked ~ .check-text {
      text-decoration: line-through;
      color: var(--green);
    }

    .button-group {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
      margin-bottom: 30px;
    }

    .mainB {
      align-items: center;
      width: 8rem;
      height: 5rem;
      font-family: FUTURA;
      font-size: 1rem;
      margin-bottom: 20px;
      border-radius: 200px;
    }

    .mainB:hover {
      background: rgb(0, 255, 0);
      text-color: var(--black);
    }

    /*cal*/

    .cal {
      padding-top: 150px;
      width: 360px;
      min-width: 360px;
      min-height: 360px;
      color: white;

      margin: 0 auto;
    }
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .day-n {
      text-align: center;
      font-weight: bold;
      padding: 8px;
      padding-top: 10px;
    }

    .day {
      text-align: center;
      padding: 30px 0;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      font-size: 1rem;
    }

    .day:hover {
      background: rgb(255, 255, 255, 0.3);
    }

    .day.selected {
      background: rgb(255, 255, 255);
      color: rgb(0, 0, 0);
      font-weight: 600;
    }

    .day.empty {
      border: none;
    }

    .day.today {
      background: rgb(0, 255, 0);
      color: rgb(0, 0, 0);
      font-weight: 600;
    }

    #prev,
    #next {
      width: 32px;
      height: 32px;
      border: 1px solid white;
      border-radius: 15%;
      background: transparent;
      color: white;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }

    #prev:hover,
    #next:hover {
      background: rgb(255, 255, 255);
      color: black;
    }

    #prev:focus,
    #next:focus {
      outline: none;
      background: transparent;
      color: white;
    }

    .cl3 {
      margin-top: 50px;
      margin-bottom: -130;
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 999;

      display: none;
      justify-content: center;
      align-items: center;
    }

    .overlay.active {
      display: flex;
    }

    .popup {
      background: white;
      color: black;
      padding: 2rem;
      width: 320px;
      position: relative;
      border-radius: 1rem;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: transparent;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      width: 90%;
      margin: 2rem auto;
    }
  </style>
